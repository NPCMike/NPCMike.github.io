<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Windows IRQL levels">
  <rect width="720" height="400" fill="#0a1118"/>
  <text x="360" y="32" fill="#d2d8e1" font-family="Consolas, monospace" font-size="16" text-anchor="middle">IRQL Levels (simplified)</text>
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="200" y="55" width="320" height="36" fill="#2a1818" stroke="#8b4049"/><text x="360" y="78" fill="#e4e5e8" text-anchor="middle">HIGH_LEVEL - power fail</text>
    <rect x="200" y="95" width="320" height="36" fill="#2a1818" stroke="#8b4049"/><text x="360" y="118" fill="#e4e5e8" text-anchor="middle">DIRQL - device ISRs</text>
    <rect x="200" y="135" width="320" height="36" fill="#1a2028" stroke="#c9a227"/><text x="360" y="158" fill="#e4e5e8" text-anchor="middle">DISPATCH_LEVEL - DPCs, spinlocks</text>
    <rect x="200" y="175" width="320" height="36" fill="#1a2830" stroke="#5a8fbd"/><text x="360" y="198" fill="#e4e5e8" text-anchor="middle">APC_LEVEL - APC delivery</text>
    <rect x="200" y="215" width="320" height="36" fill="#152018" stroke="#6d8f7d"/><text x="360" y="238" fill="#e4e5e8" text-anchor="middle">PASSIVE_LEVEL - most driver code</text>
  </g>
  <text x="540" y="160" fill="#a3abb5" font-size="11">^ higher = less preemption</text>
  <text x="80" y="290" fill="#bdd2c7" font-size="12">DISPATCH+: no page fault, no paged pool</text>
  <text x="80" y="312" fill="#bdd2c7" font-size="12">PASSIVE: can wait, use paged code/data</text>
  <text x="80" y="350" fill="#7a8794" font-size="11">Bugcheck 0x0A often = IRQL_NOT_LESS_OR_EQUAL</text>
</svg>
