<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="OCI VCN network topology">
  <rect width="720" height="380" fill="#0a1118"/>
  <text x="360" y="32" fill="#d2d8e1" font-family="Consolas, monospace" font-size="16" text-anchor="middle">OCI VCN - Typical Three-Tier</text>
  <rect x="60" y="55" width="600" height="280" rx="8" fill="#121820" stroke="#6d8f7d"/>
  <text x="360" y="78" fill="#a3abb5" font-size="12" text-anchor="middle">VCN 10.0.0.0/16</text>
  <rect x="90" y="95" width="160" height="100" rx="4" fill="#1a2830" stroke="#5a8fbd"/>
  <text x="170" y="125" fill="#e4e5e8" font-size="12" text-anchor="middle">Public Subnet</text>
  <text x="170" y="148" fill="#a3abb5" font-size="10" text-anchor="middle">LB / Bastion</text>
  <text x="170" y="168" fill="#a3abb5" font-size="10" text-anchor="middle">Internet GW</text>
  <rect x="280" y="95" width="160" height="100" rx="4" fill="#152018" stroke="#6d8f7d"/>
  <text x="360" y="125" fill="#e4e5e8" font-size="12" text-anchor="middle">Private Subnet</text>
  <text x="360" y="148" fill="#a3abb5" font-size="10" text-anchor="middle">App / OKE</text>
  <text x="360" y="168" fill="#a3abb5" font-size="10" text-anchor="middle">NAT GW outbound</text>
  <rect x="470" y="95" width="160" height="100" rx="4" fill="#141008" stroke="#c9a227"/>
  <text x="550" y="125" fill="#e4e5e8" font-size="12" text-anchor="middle">Private Subnet</text>
  <text x="550" y="148" fill="#a3abb5" font-size="10" text-anchor="middle">Database</text>
  <text x="550" y="168" fill="#a3abb5" font-size="10" text-anchor="middle">No public IP</text>
  <rect x="90" y="220" width="540" height="50" rx="4" fill="#0c141c" stroke="#b0c2d02d"/>
  <text x="360" y="250" fill="#bdd2c7" font-size="11" text-anchor="middle">Service Gateway -&gt; Object Storage / Oracle services (no internet)</text>
  <text x="360" y="355" fill="#7a8794" font-size="11" text-anchor="middle">NSG + Security Lists -&gt; Flow Logs / Logging Analytics</text>
</svg>
